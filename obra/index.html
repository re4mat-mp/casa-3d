<html lang="es">
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Casa en la ladera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root{--paper:#ffffff;--ink:#141414;--ink-2:#5f5f5f;--ink-3:#8c8c8c;--rule:#e3e3e3;--callout:#f4f4f4;--accent:#f28c1e;--mono:"Geist Mono",ui-monospace,Menlo,monospace}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Geist,-apple-system,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.45;overflow:hidden;-webkit-text-size-adjust:100%}
.app{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:11px 16px 8px;border-bottom:1px solid var(--rule)}
header h1{font-size:15px;font-weight:600;margin:0;letter-spacing:-.01em}
header .sub{display:block;font-size:12.5px;color:var(--ink-2);margin-top:1px}
header .where{font-family:var(--mono);font-size:12px;color:var(--ink-2);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.stage{position:relative;flex:1;min-height:200px;overflow:hidden}
#c{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
.callout{position:absolute;left:12px;top:12px;max-width:calc(100% - 120px);background:var(--callout);border:1px solid var(--rule);border-radius:2px;padding:7px 9px 6px}
.callout[hidden]{display:none}
.callout .h{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin:0 0 5px}
.callout ul{list-style:none;margin:0;padding:0;display:flex;gap:10px;flex-wrap:wrap;max-width:300px}
.callout li{width:54px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.callout li:active img{border-color:var(--accent)}
.callout .th{position:relative;width:46px;height:46px}
.callout img{width:46px;height:46px;display:block;background:#fff;border:1px solid var(--rule);border-radius:2px}
.callout .q{position:absolute;right:-6px;bottom:-4px;font-family:var(--mono);font-size:10.5px;background:var(--ink);color:#fff;border-radius:2px;padding:1px 4px;line-height:1.3}
.callout .nm{font-size:10.5px;line-height:1.2;text-align:center;color:var(--ink-2);text-wrap:balance}
.replay{position:absolute;right:12px;top:12px;height:30px;padding:0 10px;font-size:12.5px;border:1px solid var(--rule);background:var(--paper);color:var(--ink-2)}
.replay[hidden]{display:none}
#dims{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.dim,.note,.mark{position:absolute;left:0;top:0;opacity:0;transition:opacity .35s;will-change:transform;white-space:nowrap}
.dim,.note{font-family:var(--mono);font-size:11px;line-height:1.2;background:var(--paper);border:1px solid var(--ink);color:var(--ink);padding:1px 5px;border-radius:2px}
.note{border-color:var(--rule);color:var(--ink-2)}
.mark{width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;font:500 11px/20px var(--mono);text-align:center;box-shadow:0 0 0 1.5px #fff,0 0 0 2.5px var(--ink)}
.mark i{position:absolute;left:50%;top:50%;height:1px;background:var(--ink);transform-origin:0 50%;box-shadow:0 1px 0 #fff}
.dim.on,.note.on,.mark.on{opacity:1}
.plan{position:absolute;right:12px;top:52px;width:84px;height:84px;border:1px solid var(--rule);border-radius:2px;pointer-events:none}
.plan span{position:absolute;left:5px;top:3px;font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.bubble{position:absolute;right:12px;bottom:12px;width:116px;height:116px;pointer-events:none;display:none;overflow:hidden}
.bubble.on{display:block}
.bubble i{position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 90px var(--paper);border:1px solid var(--ink);transform-origin:50% 50%}
.leader,.ring{position:absolute;left:0;top:0;pointer-events:none;display:none}
.leader{height:1px;background:var(--ink);transform-origin:0 50%}
.ring{width:18px;height:18px;border-radius:50%;border:1px solid var(--ink);box-shadow:0 0 0 1px #fff inset}
.bubble.on ~ .leader,.bubble.on ~ .ring{display:block}
.scale{position:absolute;left:12px;bottom:12px;display:flex;align-items:center;gap:6px;font:11px var(--mono);color:var(--ink);pointer-events:none}
.scale span{background:var(--paper);padding:0 3px;border-radius:2px}
.scale i{display:block;height:1px;background:var(--ink);position:relative}
.scale i::before,.scale i::after{content:"";position:absolute;top:-3px;width:1px;height:7px;background:var(--ink)}
.scale i::before{left:0}.scale i::after{right:0}
.progress{height:14px;position:relative;border-top:1px solid var(--rule)}
.progress i{position:absolute;left:0;top:-1px;height:2px;background:var(--ink);transition:width .5s cubic-bezier(.22,1,.36,1)}
.progress .ticks{position:absolute;left:0;right:0;top:0;height:14px;display:flex}
.progress .ticks b{flex:1;position:relative}
.progress .ticks b::after{content:"";position:absolute;right:0;top:0;width:1px;height:5px;background:var(--rule)}
.progress .ticks b.done::after{background:var(--ink)}
.sheet{touch-action:pan-y;padding:10px 16px 6px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 14px;align-items:start;max-height:36%;overflow-y:auto;overscroll-behavior:contain}
.num{font-size:44px;font-weight:600;line-height:.95;letter-spacing:-.03em;font-variant-numeric:tabular-nums;min-width:1.4ch;color:var(--ink)}
.num small{font-size:13px;font-weight:500;letter-spacing:0;color:var(--ink-2);display:block;margin-top:2px}
.body{min-width:0;transition:opacity .16s}
.title{font-weight:600;font-size:16.5px;margin:3px 0 2px;text-wrap:balance;letter-spacing:-.01em}
.text{margin:0;max-width:64ch}
.text:empty{display:none}
.acts{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:5px;max-width:64ch}
.acts li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;align-items:start}
.acts b{width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;font:500 11px/20px var(--mono);text-align:center;margin-top:1px}
.acts:empty{display:none}
.meta{font-family:var(--mono);font-size:12px;color:var(--ink-2);margin-top:6px;font-variant-numeric:tabular-nums}
.meta:empty{display:none}
.tip{margin:6px 0 0;font-size:13.5px;color:var(--ink-2);max-width:64ch;padding-left:10px;border-left:2px solid var(--rule)}
.tip:empty{display:none}
.inv{margin:8px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 14px;font-size:13.5px}
.inv li{display:flex;gap:8px;align-items:center;padding:3px 0;border-bottom:1px solid var(--rule);min-width:0}
.inv img{width:34px;height:34px;flex:none;border:1px solid var(--rule);border-radius:2px;background:#fff}
.inv .q{font-family:var(--mono);color:var(--ink-2);min-width:3.2em;font-variant-numeric:tabular-nums;font-size:12px}
.inv .nm{min-width:0}
.grp{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin:12px 0 0}
.cal{margin:8px 0 0;padding:0;list-style:none;font-size:14px}
.cal li{display:flex;gap:10px;padding:3px 0;border-bottom:1px solid var(--rule)}
.cal .d{font-family:var(--mono);color:var(--ink-2);min-width:7.6em;font-variant-numeric:tabular-nums;font-size:12.5px;padding-top:1px}
.nav{display:grid;grid-template-columns:1fr 2fr;gap:8px;padding:8px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--rule)}
button{font:inherit;font-weight:500;height:52px;border-radius:2px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer;padding:0 14px;-webkit-tap-highlight-color:transparent}
button.primary{background:var(--ink);border-color:var(--ink);color:#fff}
button:disabled{opacity:.35;cursor:default}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:430px){body{font-size:14.5px}.tip{font-size:13px}.title{font-size:16px}}
@media (prefers-reduced-motion:reduce){.progress i,.dim,.note,.mark,.body{transition:none}}
@media (max-width:759px){.callout{padding:5px 6px 4px;max-width:calc(100% - 132px)}.callout .h{font-size:9.5px;margin:0 0 3px}.callout ul{flex-wrap:nowrap;overflow-x:auto;gap:6px;max-width:none;scrollbar-width:none;padding-bottom:2px}.callout ul::-webkit-scrollbar{display:none}.callout li{flex:0 0 40px;width:40px}.callout .th,.callout img{width:32px;height:32px;box-sizing:border-box}.callout .q{font-size:9px;padding:0 3px}.callout .nm{font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40px}
  .callout.more::after{content:"";position:absolute;right:1px;top:1px;bottom:1px;width:28px;background:linear-gradient(to right,rgba(244,244,244,0),var(--callout));pointer-events:none}}
@media (min-width:760px){.sheet{max-height:34%}.callout ul{max-width:420px}.bubble{width:150px;height:150px}}
</style>
<div class="app">
  <header>
    <div><h1 id="h1"></h1><span class="sub" id="sub"></span></div>
    <span class="where" id="where"></span>
  </header>
  <div class="stage">
    <canvas id="c"></canvas>
    <div id="dims"></div>
    <div class="callout" id="callout" hidden><p class="h">Piezas de este paso · toca una para ubicarla</p><ul id="parts"></ul></div>
    <div class="plan"><span>Planta</span></div>
    <div class="bubble" id="bubble"><i></i></div><div class="leader" id="leader"></div><div class="ring" id="ring"></div>
    <div class="scale"><i id="scaleBar"></i><span id="scaleTxt">1 m</span></div>
    <button class="replay" id="replay" type="button">Repetir</button>
  </div>
  <div class="progress"><i id="bar"></i><div class="ticks" id="ticks"></div></div>
  <div class="sheet" id="sheet">
    <div class="num" id="num"></div>
    <div class="body" id="body">
      <h2 class="title" id="title"></h2>
      <p class="text" id="text"></p>
      <ol class="acts" id="acts"></ol>
      <div class="meta" id="meta"></div>
      <p class="tip" id="tip"></p>
      <div id="extra"></div>
    </div>
  </div>
  <div class="nav">
    <button id="prev" type="button">Atrás</button>
    <button id="next" type="button" class="primary">Siguiente</button>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ======================================================================
   CONFIG: everything project-specific that is data lives here.
   Scene geometry, part builders (P) and reg() calls live in the
   PROJECT SCENE block further down (they need the helpers). Units: meters (CONFIG.units).
   ====================================================================== */
/* CASA: the house as data, ported 1:1 from casa_3d/index.html (v1), whose coordinates were measured from the
   architect's plans (PK 17-07-2026, plantas esc. 1/50). Every row is the argument list of one v1 call, so any
   number here can be checked against v1. Meters: x = right on the plan, z = down the plan (toward the hill;
   the lake is at -z), y up. Zócalo floor top y=0.05, first floor y=3.0, walls 2.70 m.
   The numbers on the pages (m², m, counts) are computed from these rows, not typed. */
var CASA = (function(){
  var LV_Z = 0.05, LV_F = 3.0, H = 2.7;

  /* terrainH(x,z), verbatim from v1: flat lower zone y=0, plateau y=3 behind the house and at the west parking,
     slope down toward the lake in front (the slope and the plateau shape are v1 estimates, not survey data) */
  function noise(x, z){ return Math.sin(x * 0.13 + 1.3) * Math.cos(z * 0.11) * 1.1 + Math.sin(x * 0.37 + z * 0.21) * 0.35 + Math.cos(x * 0.05 - z * 0.07) * 1.5; }
  function onPlateau(x, z){
    if (z >= 12.25){ if (x >= -2.0 - 1e-6 && x <= 4.0 + 1e-6 && z <= 13.5 + 1e-6) return false; return true; }   /* hueco del patio inglés */
    if (x <= -11.25 && z >= 0.25) return true;
    if (x <= -9.75 && z >= 6.75) return true;
    return false; }
  function terrainH(x, z){ var y;
    if (z >= 18.5) y = 3 + (z - 18.5) * 0.38; else if (onPlateau(x, z)) y = 3; else if (z > -4) y = 0; else y = (z + 4) * 0.3;
    var w = 0; if (z < -7) w = Math.min(1, (-7 - z) / 12); if (z > 19) w = Math.min(1, (z - 19) / 10);
    var dx = x < -26 ? -26 - x : x > 34 ? x - 34 : 0; w = Math.max(w, Math.min(1, dx / 15));
    y += noise(x, z) * w; if (z < -34) y = Math.min(y, -9.5 - (-34 - z) * 0.2); return y; }

  var SITE = {x0: -22, x1: 27, z0: -10, z1: 20, base: -3.2};   /* the trimmed patch of hillside the manual draws */

  /* retaining(x0,x1,z0,z1), 0 → 3 m. The two long runs are trimmed to the patch (v1 runs them to x=-45 and x=32). */
  var RET = {
    fondo: [[-10.0, -2.5, 12.0, 12.5], [4.5, 11.2, 11.36, 12.5], [11.2, 19.4, 12.0, 12.5], [19.07, 19.4, 9.1, 12.0], [19.4, SITE.x1, 12.0, 12.5]],
    patio: [[-2.5, -1.96, 11.36, 14.0], [3.77, 4.5, 11.36, 14.0], [-2.5, 4.5, 13.58, 14.0]],
    oeste: [[-10.0, -9.5, 6.4, 12.5], [-11.5, -11.0, 0, 7.0], [SITE.x0, -11.0, 0, 0.5], [-11.0, -10.0, 6.4, 7.0]]
  };
  var RADIER = [-9.57, 22.3, -0.14, 12.13];     /* box(-9.57,22.3,-0.05,LV_Z,-0.14,12.13) */
  var PATIO = [-1.96, 3.77, 11.36, 13.58];      /* piso del patio inglés, 0 → LV_Z */

  /* wall(x1,z1,x2,z2,{out,win:[[a0,a1,sill,head]],h}) on the zócalo (base 0.05), grouped by v1's room clusters */
  var ZW = {
    frente: [[12.92, 3.6, 14.84, 3.6, {out: 'n', win: [[13.2, 14.5, 1.6, 2.3]]}], [20.36, 3.6, 22.3, 3.6, {out: 'n'}],
             [-0.02, -0.14, -0.02, 1.5, {out: 'w'}], [7.4, -0.14, 7.4, 1.5, {out: 'e'}]],
    dormitorios: [[-7.42, 3.6, -7.42, 7.98, {out: 'w', win: [[4.4, 6.6, 0.9, 2.2]]}], [-3.7, 3.6, -3.7, 7.98], [0.02, 3.6, 0.02, 7.98], [7.37, 3.6, 7.37, 7.98],
             [-7.42, 7.92, -4.6, 7.92], [-3.7, 7.92, -1.0, 7.92], [0.02, 7.92, 5.7, 7.92, {win: [[1.16, 2.36, 0.9, 2.2], [3.42, 4.62, 0.9, 2.2]]}], [7.37, 7.92, 11.99, 7.92]],
    bano3: [[12.92, 3.6, 12.92, 6.18], [12.92, 7.08, 12.92, 7.98], [13.6, 6.18, 14.84, 6.18], [14.84, 3.6, 14.84, 7.98], [12.92, 7.92, 14.84, 7.92]],
    este: [[20.36, 3.6, 20.36, 7.98], [22.3, 3.6, 22.3, 7.98, {out: 'e'}], [20.36, 7.98, 22.3, 7.98, {out: 's'}]],
    servicio: [[-6.58, 9.22, -6.58, 10.2], [-6.58, 11.0, -6.58, 12.04], [-5.64, 9.22, -4.01, 9.22], [-4.01, 9.22, -4.01, 12.04], [-4.01, 9.22, -2.82, 9.22],
             [-2.0, 9.22, -2.0, 11.36], [-2.0, 9.22, 0.09, 9.22], [0.8, 9.22, 5.65, 9.22],
             [-1.96, 11.36, 3.77, 11.36, {out: 's', win: [[-1.5, 3.4, 0.9, 2.3]]}], [5.65, 9.22, 5.65, 11.36]],
    escalera: [[7.4, 9.05, 7.4, 11.34], [8.6, 9.05, 11.16, 9.05], [11.16, 9.05, 11.16, 12.13]],
    bodegas: [[12.23, 9.1, 14.88, 9.1], [14.88, 10.0, 14.88, 12.13], [14.88, 9.1, 17.44, 9.1, {out: 'n'}]]
  };
  /* v1's ghost walls: futuro baño 5 / dormitorio 6 and the possible dormitorio de servicio */
  var ZFUT = [[16.66, 3.6, 16.66, 6.3], [14.84, 6.3, 16.66, 6.3], [14.84, 7.98, 20.36, 7.98], [0.09, 9.22, 0.09, 11.36]];
  var ZFUT_GLASS = [[14.84, 3.6, 20.36, 3.6]];
  var ZFUT_BED = [18.3, 20.3, LV_Z, LV_Z + 0.55, 4.84, 6.64];
  /* glass(x1,z1,x2,z2): the zócalo's sliding glazing to the lake */
  var ZG = [[-7.42, 3.6, -3.7, 3.6], [-3.7, 3.6, 0.02, 3.6], [0.02, 3.6, 7.37, 3.6], [7.37, 3.6, 12.92, 3.6]];

  /* first floor (base 3.0) */
  var FW = {
    centro: [[0, -0.2, 0, 1.5, {out: 'w'}], [0, 7.8, 0, 10.32, {out: 'w'}], [0, 11.28, 0, 12.06, {out: 'w'}], [7.4, -0.2, 7.4, 3.56, {out: 'e'}], [7.4, 3.56, 7.4, 7.92],
             [0, 12.06, 5.64, 12.06, {out: 's', win: [[1.8, 4.26, 0.95, 2.2]]}], [5.64, 7.8, 5.64, 12.06], [8.4, 9.0, 11.16, 9.0], [11.16, 9.0, 11.16, 12.06]],
    ala: [[12.9, 3.56, 14.82, 3.56, {out: 'n', win: [[13.2, 14.5, 1.6, 2.3]]}], [22.2, 3.56, 22.2, 7.8, {out: 'e', win: [[4.2, 7.2, 0.5, 2.4]]}], [7.4, 7.2, 11.9, 7.2],
          [12.9, 3.56, 12.9, 6.18], [12.9, 7.02, 12.9, 7.86], [13.9, 6.18, 14.82, 6.18], [14.82, 3.56, 14.82, 7.86], [12.9, 7.86, 14.82, 7.86]],
    alaFondo: [[16.92, 7.8, 19.5, 7.8], [19.5, 7.8, 22.2, 7.8, {out: 's'}], [15.8, 7.8, 15.8, 9.2], [12.9, 9.2, 14.5, 9.2], [15.4, 9.2, 15.8, 9.2], [17.8, 9.2, 19.5, 9.2],
          [16.92, 9.2, 16.92, 10.14], [15.48, 10.14, 16.92, 10.14], [15.48, 9.2, 15.48, 12.06], [12.06, 9.2, 12.06, 10.38], [12.06, 10.38, 12.9, 10.38], [12.9, 9.2, 12.9, 12.06],
          [11.16, 12.06, 19.5, 12.06, {out: 's', win: [[11.5, 12.6, 1.5, 2.2], [13.3, 15.0, 1.5, 2.2], [15.7, 16.7, 1.5, 2.2], [17.3, 19.1, 1.5, 2.2]]}],
          [19.5, 7.8, 19.5, 12.06, {out: 'e', win: [[8.0, 9.0, 0.9, 2.2], [10.3, 11.7, 1.5, 2.2]]}]],
    quincho: [[-7.38, 3.48, -7.38, 6.36, {out: 'w'}], [-9.6, 7.8, -9.6, 12.0, {h: 1.8, out: 'w'}], [-9.6, 7.8, -6.66, 7.8, {h: 1.8}], [-9.6, 12.0, -6.66, 12.0, {h: 1.8, out: 's'}],
          [-6.66, 7.8, -6.66, 10.26], [-6.66, 12.0, -1.08, 12.0, {out: 's'}]]
  };
  var FG = {
    centro: [[0, 1.5, 0, 7.8], [0, 0, 7.4, 0], [5.64, 11.34, 7.4, 11.34], [7.4, 11.34, 11.16, 11.34]],   /* ventanales del living + puerta de entrada + vidrio de la escalera */
    ala: [[7.4, 3.56, 12.9, 3.56], [14.82, 3.56, 22.2, 3.56]]
  };
  /* rail(x1,z1,x2,z2,LV_F): terrazas, vacío del patio inglés, escalera, quincho */
  var RAILS = [[-1.9, -1.7, 9.3, -1.7], [-1.9, -1.7, -1.9, 1.5], [-8.7, 1.5, -1.9, 1.5], [-8.7, 1.5, -8.7, 3.56], [-8.7, 3.56, -7.38, 3.56],
    [9.3, -1.7, 9.3, 1.52], [9.3, 1.52, 22.28, 1.52], [22.28, 1.52, 22.28, 3.56],
    [-2.23, 12.06, -2.23, 13.8], [4.13, 12.06, 4.13, 13.8], [-2.23, 13.8, 4.13, 13.8],
    [8.4, 9.0, 8.4, 10.17], [-7.38, 6.36, -7.38, 7.8], [-1.08, 12.06, 0, 12.06]];

  tween(1, function(){ detail = {p: v(spec.p), r: spec.r, hide: spec.hide || [], v: (spec.view || spec.v) ? v(spec.view || spec.v).normalize() : null}; bubble.classList.add('on'); }, null, delay);

var tmpV = new T.Vector3();

var calloutEl = $('#callout'), partsEl = $('#parts');

partsEl.addEventListener('scroll', partsCue, {passive: true});

var current = -1, rotUser = 0;
var where = $('#where'), body = $('#body');
function enter(i, replay){
  var s = STEPS[i], sp = specOf(i); clearTemps(); clearDims(); tweens = []; setDetail(null);
  var r0 = rotUser; if (Math.abs(r0) > 0.001) tween(700, function(e){ rotUser = r0 * (1 - e); });
  var base = (i === 0 || i === LAST) ? LAST : i - 1;
  applyState(base, i);
  order.forEach(function(key){ var o = objs[key], u = o.userData; if (u.only && u.only.indexOf(i) < 0 && u.only.indexOf(i - 1) >= 0 && i !== 0){ o.visible = true; setOpacity(o, 1); (function(o2){ tween(260, function(e){ setOpacity(o2, 1 - e); if (e >= 1) o2.visible = false; }); })(o); } });
  if (cutNow.length){ cutNow.forEach(function(k){ setOpacity(objs[k], CUT_O); }); } setCut(sp.cut);
  moveCam(sp);
  var lastLand = 350;
  if (i > 0 && i < LAST){
    order.forEach(function(key){ var o = objs[key], u = o.userData;
      var arrives = u.only ? (u.only.indexOf(i) >= 0 && u.only.indexOf(i - 1) < 0) : u.add === i;
      if (arrives){
        var lag = 350 + u.lag * 1000; var from = u.dest.clone().add(u.from);
        if (!u.noGhost && (!u.each || o.children.length <= 8)){ var gh = ghostOf(o); world.add(gh); temps.push(gh); (function(g2, l2, d2){ tween(d2, function(e){ setOpacity(g2, 1 - e); if (e >= 1) g2.visible = false; }, null, l2); })(gh, lag, u.each ? u.span * 1000 + 400 : 700); }
        if (!u.noArrow){ var ar = arrow(from.clone().addScaledVector(u.from, -0.1), u.dest.clone().addScaledVector(u.from.clone().normalize(), 0.3 * G)); ar.visible = !reduce; world.add(ar); temps.push(ar); (function(ar2, l2){ tween(300, function(e){ setOpacity(ar2, 1 - e); if (e >= 1) ar2.visible = false; }, null, l2 + 650); })(ar, lag); }
        if (u.each){ o.visible = true; o.position.copy(u.dest); var n = o.children.length; o.children.forEach(function(ch, j){ if (!ch.userData.dest) ch.userData.dest = ch.position.clone(); landing(ch, ch.userData.dest.clone().add(u.from), ch.userData.dest, lag + accel(j, n, u.span) * 1000, 520); }); lastLand = Math.max(lastLand, lag + u.span * 1000 + 520); }
        else { landing(o, from, u.dest, lag); lastLand = Math.max(lastLand, lag + 700); }
      } else if (u.remove === i){
        o.visible = true; o.position.copy(u.dest); setOpacity(o, 1); var to = u.dest.clone().add(u.from); var lag2 = 350 + u.lag * 1000;
        var ar3 = arrow(u.dest.clone().addScaledVector(u.from.clone().normalize(), 0.9 * G), to); ar3.visible = !reduce; world.add(ar3); temps.push(ar3);
        (function(o2, to2, ar4, l3){ tween(700, function(e){ o2.position.lerpVectors(o2.userData.dest, to2, e); setOpacity(o2, 1 - e * 0.9); if (e >= 1) o2.visible = false; }, ease, l3); tween(300, function(e){ setOpacity(ar4, 1 - e); if (e >= 1) ar4.visible = false; }, null, l3 + 650); })(o, to, ar3, lag2);
        lastLand = Math.max(lastLand, lag2 + 700);
      }
    });
  }
  if (i === LAST){ /* grow parts rise out of the model, slow first and then all at once */
    order.forEach(function(key){ var o = objs[key], u = o.userData; if (!u.grow || !o.visible) return; var lag = 500 + u.lag * 1000, n = o.children.length;
      o.children.forEach(function(ch, j){ ch.scale.setScalar(0.001); (function(c2, d){ tween(600, function(e){ c2.scale.setScalar(0.001 + 0.999 * e); }, ease, d); })(ch, lag + accel(j, n, u.span) * 1000); }); }); }
  if (s.onEnter){ var r = s.onEnter({i: i, lastLand: lastLand, objs: objs, tween: tween, ease: ease, easeIO: easeIO, setOpacity: setOpacity, setColor: setColor, paint: paint, T: T, still: reduce}); if (typeof r === 'number') lastLand = r; }
  (s.dims || []).forEach(function(d, j){ addDim(d, lastLand + 250 + j * 150); });
  (s.notes || []).forEach(function(nt, j){ addNote(nt, lastLand + 250 + j * 150); });
  (s.acts || []).forEach(function(a, j){ if (a[1]) addMark(j + 1, a[1], a[2], lastLand + 350 + j * 120); });
  setDetail(s.detail, lastLand + 600);
  var fill = function(){
    $('#num').innerHTML = i === 0 ? '<small>Piezas</small>' : (i === LAST ? '<small>Lista</small>' : String(i));

    var extra = $('#extra'); extra.innerHTML = '';
    if (s.inventory){ INVENTORY.forEach(function(gp){ var h = document.createElement('p'); h.className = 'grp'; h.textContent = gp[0]; extra.appendChild(h); var ul = document.createElement('ul'); ul.className = 'inv'; gp[1].forEach(function(p){ ul.appendChild(partItem(p[0], p[1], 'inv')); }); extra.appendChild(ul); }); }
    if (s.calendar){ var cl = document.createElement('ul'); cl.className = 'cal'; s.calendar.forEach(function(p){ var li = document.createElement('li'); li.innerHTML = '<span class="d"></span><span></span>'; li.children[0].textContent = p[0]; li.children[1].textContent = p[1]; cl.appendChild(li); }); extra.appendChild(cl); }
    $('#sheet').scrollTop = 0; body.style.opacity = 1;
  };
  if (reduce || current < 0 || replay){ fill(); } else { body.style.opacity = 0; setTimeout(fill, 150); }
  var co = $('#callout'), pl = $('#parts'); pl.innerHTML = '';
  if (s.parts && s.parts.length){ s.parts.forEach(function(p){ pl.appendChild(partItem(p[0], p[1], 'callout')); }); co.hidden = false; } else { co.hidden = true; } partsCue();
  $('#replay').hidden = !(i > 0 && i < LAST);
  $('#prev').disabled = i === 0; $('#next').textContent = i === LAST ? 'Volver a las piezas' : (i === 0 ? 'Empezar' : (i === LAST - 1 ? 'Terminar' : 'Siguiente'));
  $('#bar').style.width = (i / LAST * 100) + '%';
  Array.prototype.forEach.call($('#ticks').children, function(b, j){ b.classList.toggle('done', j < i); });
  where.textContent = (CONFIG.date ? CONFIG.date + ' · ' : '') + (i === 0 ? 'piezas' : (i === LAST ? 'lista' : i + ' de ' + (LAST - 1)));

}
(function(){ var t = $('#ticks'); for (var j = 0; j < LAST; j++) t.appendChild(document.createElement('b')); })();
function go(d){ var n = current + d; if (n < 0) n = 0; if (n > LAST) n = 0; enter(n); }
$('#prev').addEventListener('click', function(){ go(-1); });
$('#next').addEventListener('click', function(){ go(1); });
$('#replay').addEventListener('click', function(){ enter(current, true); });
document.addEventListener('keydown', function(e){ if (e.key === 'ArrowRight' || e.key === ' '){ e.preventDefault(); go(1); } if (e.key === 'ArrowLeft'){ e.preventDefault(); go(-1); } if (e.key === 'r') enter(current, true); });
(function(){ var t0 = null; var el = $('#sheet'); el.addEventListener('pointerdown', function(e){ t0 = {x: e.clientX, y: e.clientY, id: e.pointerId}; }, {passive: true});
  el.addEventListener('pointerup', function(e){ if (!t0 || e.pointerId !== t0.id) return; var dx = e.clientX - t0.x, dy = e.clientY - t0.y; t0 = null; if (Math.abs(dx) > 60 && Math.abs(dy) < 40) go(dx < 0 ? 1 : -1); }, {passive: true});
  el.addEventListener('pointercancel', function(){ t0 = null; }); })();

var drag = null;
canvas.addEventListener('pointerdown', function(e){ drag = {x: e.clientX, rot: rotUser}; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', function(e){ if (!drag) return; rotUser = Math.max(-0.9, Math.min(0.9, drag.rot + (e.clientX - drag.x) * 0.006)); });
canvas.addEventListener('pointerup', function(){ drag = null; }); canvas.addEventListener('pointercancel', function(){ drag = null; });

function wake(){ if (navigator.wakeLock && navigator.wakeLock.request) navigator.wakeLock.request('screen').catch(function(){}); }
document.addEventListener('pointerdown', wake, {once: true}); document.addEventListener('visibilitychange', function(){ if (!document.hidden) wake(); });

function resize(){ var w = stage.clientWidth, h = stage.clientHeight; var ps = (h < 480 ? 84 : 104) + 'px'; planEl.style.width = ps; planEl.style.height = ps; renderer.setSize(w, h, false); frame(camT.c, camT.r); if (typeof partsCue === 'function') partsCue(); }
new ResizeObserver(resize).observe(stage);
var dTarget = new T.Vector3(), pivotV = new T.Vector3(), Y_AXIS = new T.Vector3(0, 1, 0);
function loop(now){
  stepTweens(now);
  world.rotation.y = rotUser + (reduce ? 0 : 0.028 * Math.sin(now / 9000 * Math.PI * 2));
  world.position.copy(camT.c).sub(pivotV.copy(camT.c).applyAxisAngle(Y_AXIS, world.rotation.y));   /* turn about the framed centre, not the world origin */
  world.updateMatrixWorld();
  planFrame.position.set(camT.c.x, planCam.position.y - 10, camT.c.z); planFrame.scale.set(camT.r * 0.8, 1, camT.r * 0.8);
  var w = stage.clientWidth, h = stage.clientHeight;
  renderer.shadowMap.needsUpdate = true;
  renderer.setViewport(0, 0, w, h); renderer.setScissorTest(false); renderer.setClearColor(0xffffff, 1); renderer.render(scene, camera);
  var PLAN_PX = planEl.clientWidth || 84; var px = w - PLAN_PX - 12, py = h - 52 - PLAN_PX;
  renderer.setScissorTest(true); renderer.setViewport(px, py, PLAN_PX, PLAN_PX); renderer.setScissor(px, py, PLAN_PX, PLAN_PX); renderer.setClearColor(0xf7f6f2, 1); renderer.clear(); renderer.render(scene, planCam);
  if (detail && bubbleK > 0.02){
    var D = bubble.clientWidth, dsz = Math.max(2, D * bubbleK); var cx = w - 12 - D / 2, cyy = 12 + D / 2; var bx = cx - dsz / 2, by = cyy - dsz / 2;
    dTarget.copy(detail.p).applyMatrix4(world.matrixWorld); detailCam.position.copy(dTarget).addScaledVector(detail.v || VIEW, 60); detailCam.lookAt(dTarget); var r = detail.r; detailCam.left = -r; detailCam.right = r; detailCam.top = r; detailCam.bottom = -r; detailCam.updateProjectionMatrix();
    renderer.setViewport(bx, by, dsz, dsz); renderer.setScissor(bx, by, dsz, dsz); renderer.setClearColor(0xffffff, 1); renderer.clear(); var hid = detail.hide.filter(function(k){ return objs[k] && objs[k].visible; }); hid.forEach(function(k){ objs[k].visible = false; }); renderer.render(scene, detailCam); hid.forEach(function(k){ objs[k].visible = true; });
    var s2 = project(detail.p, w, h); var ax = s2[0], ay = s2[1]; var bcx = cx, bcy = h - cyy; var ang = Math.atan2(ay - bcy, ax - bcx); var L = Math.hypot(ax - bcx, ay - bcy); var start = dsz / 2 + 1;

}

var start = 0; try { start = Math.min(LAST, Math.max(0, parseInt(localStorage.getItem(CONFIG.storageKey) || '0', 10) || 0)); } catch (e) {}
if (hm) start = Math.min(LAST, Math.max(0, parseInt(hm[1], 10)));
var sp0 = specOf(start); VIEW.copy(v(sp0.v)).normalize(); resize(); frame(v(sp0.c), sp0.r); enter(start);
requestAnimationFrame(loop);
})();
