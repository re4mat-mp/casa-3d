<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Casa en 3D</title>
<style>
  :root{
    --bg:#f4f1ec; --panel:rgba(255,255,255,.93); --ink:#1d1d1f; --muted:#6b6660;
    --line:rgba(0,0,0,.09); --accent:#2f5d50; --accent-ink:#fff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  canvas{display:block;touch-action:none;outline:none}
  #panel{position:fixed;top:16px;left:16px;width:min(300px,calc(100vw - 32px));background:var(--panel);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;
    box-shadow:0 8px 28px rgba(0,0,0,.14);font-size:13px;z-index:5}
  #panel .hd{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:12px 14px 10px}
  #panel .hd b{font-size:15px;display:block}
  #panel .hd small{color:var(--muted);display:block;margin-top:2px;line-height:1.35}
  #collapse{border:0;background:transparent;font-size:18px;line-height:1;cursor:pointer;color:var(--muted);padding:2px 4px}
  #panel .body{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
  #panel.min .body{display:none}
  .seg{display:grid;grid-template-columns:1fr 1fr;background:#ece8e2;border-radius:10px;padding:3px;gap:3px}
  .seg button{border:0;border-radius:8px;padding:8px 6px;background:transparent;font:inherit;font-weight:600;cursor:pointer;color:var(--ink)}
  .seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .row{display:flex;gap:6px;flex-wrap:wrap}
  .row button{flex:1;border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 8px;font:inherit;cursor:pointer}
  .row button:hover{background:#f7f5f2}
  .field{display:flex;flex-direction:column;gap:5px;color:var(--muted);font-weight:500}
  .field select{font:inherit;color:var(--ink);padding:7px 8px;border-radius:9px;border:1px solid var(--line);background:#fff}
  .field .lbl{display:flex;justify-content:space-between}
  .field .lbl span{color:var(--ink);font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--accent)}
  .toggles{display:flex;gap:12px;flex-wrap:wrap}
  .toggles label{display:flex;align-items:center;gap:5px;cursor:pointer}
  .toggles input{accent-color:var(--accent)}
  .note{color:var(--muted);font-size:11.5px;line-height:1.4;border-top:1px solid var(--line);padding-top:10px}
  #help{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(29,29,31,.82);color:#fff;
    padding:9px 14px;border-radius:999px;font-size:12.5px;max-width:calc(100vw - 32px);text-align:center;z-index:4;pointer-events:none}
  #dpad{position:fixed;right:16px;bottom:64px;display:none;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px);gap:6px;z-index:6}
  #dpad button{border:0;border-radius:12px;background:rgba(255,255,255,.9);font-size:20px;box-shadow:0 2px 8px rgba(0,0,0,.18);
    touch-action:none;user-select:none;-webkit-user-select:none}
  #dpad button:active{background:#ddd}
  #dpad .up{grid-column:2;grid-row:1}#dpad .left{grid-column:1;grid-row:2}#dpad .down{grid-column:2;grid-row:2}#dpad .right{grid-column:3;grid-row:2}
  body.walk #dpad{display:grid}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:20;font-size:15px;color:var(--muted)}
  #cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(255,255,255,.85);
    box-shadow:0 0 0 1px rgba(0,0,0,.35);display:none;z-index:3;pointer-events:none}
  body.walk #cross{display:block}
  @media (max-width:560px){ #panel{top:10px;left:10px;width:calc(100vw - 20px)} #help{bottom:10px;font-size:11.5px} }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="loading">Construyendo la casa…</div>
<div id="panel">
  <div class="hd">
    <div><b>Casa · borrador 3D</b><small>Hecho a partir de dos planos de planta. Medidas del plano; interiores y terreno inventados.</small></div>
    <button id="collapse" title="Ocultar">–</button>
  </div>
  <div class="body">
    <div class="seg"><button id="mOrbit" class="on">Vista aérea</button><button id="mWalk">Caminar</button></div>
    <label class="field">Ir a…
      <select id="goto"></select>
    </label>
    <div class="row"><button id="vGeneral">Vista general</button><button id="vPlanta">Ver como plano</button></div>
    <div class="toggles">
      <label><input type="checkbox" id="tRoof" checked> Techo</label>
      <label><input type="checkbox" id="tFF" checked> Primer piso</label>
      <label><input type="checkbox" id="tLabels" checked> Nombres</label>
    </div>
    <label class="field"><div class="lbl">Hora del día <span id="hourTxt">17:30</span></div>
      <input type="range" id="hour" min="6.5" max="20" step="0.25" value="17.5">
    </label>
    <div class="note">Tip: haz <b>doble clic</b> en cualquier piso o terraza para aparecer ahí caminando.</div>
  </div>
</div>
<div id="help"></div>
<div id="cross"></div>
<div id="dpad">
  <button class="up" data-k="up">▲</button><button class="left" data-k="left">◀</button>
  <button class="down" data-k="down">▼</button><button class="right" data-k="right">▶</button>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* =========================================================================
   Coordenadas: metros. x = hacia la derecha del plano, z = hacia abajo del
   plano (hacia el cerro). y = altura. Origen = esquina del ventanal del living.
   Zócalo: piso en y=0.05. Primer piso: piso en y=3.0. Muros de 2.70 m.
   ========================================================================= */
const LV_Z = 0.05, LV_F = 3.0, H = 2.7;

// ---------- renderer / escena ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.05, 1500);
camera.rotation.order = 'YXZ';

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const rnd = mulberry32(20260626);
const srgb = (r,g,b) => new THREE.Color().setRGB(r/255,g/255,b/255,THREE.SRGBColorSpace);

// ---------- cielo ----------
const skyU = { top:{value:srgb(110,160,214)}, horizon:{value:srgb(242,220,192)}, bottom:{value:srgb(150,170,170)} };
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, uniforms: skyU,
  vertexShader: `varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0);} `,
  fragmentShader: `uniform vec3 top; uniform vec3 horizon; uniform vec3 bottom; varying vec3 vP;
    void main(){ float h = vP.y; vec3 c = h > 0.0 ? mix(horizon, top, pow(min(h*1.5,1.0), 0.6)) : mix(horizon, bottom, min(-h*5.0,1.0));
    gl_FragColor = vec4(c,1.0);
    #include <tonemapping_fragment>
    #include <colorspace_fragment>
    }`
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(1000, 32, 16), skyMat);
sky.renderOrder = -1;
scene.add(sky);
scene.fog = new THREE.Fog(skyU.horizon.value.clone(), 140, 900);

// ---------- luces ----------
const hemi = new THREE.HemisphereLight(srgb(200,220,245), srgb(170,160,140), 1.1);
const amb = new THREE.AmbientLight(srgb(255,244,228), 0.45);   // luz de rebote: que los interiores no queden oscuros
scene.add(hemi, amb);
const sun = new THREE.DirectionalLight(0xffffff, 3);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left:-48, right:48, top:48, bottom:-48, near:1, far:260 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.04;
scene.add(sun, sun.target);
const CENTER = new THREE.Vector3(6, 0, 6);

// ---------- texturas (dibujadas en canvas, sin archivos) ----------
function tex(w,h,draw){ const c=document.createElement('canvas'); c.width=w; c.height=h; draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.anisotropy=renderer.capabilities.getMaxAnisotropy(); return t; }
function boards(g,w,h,{n,base,vary,gap,vertical,grain}){
  const bw=(vertical?w:h)/n;
  for(let i=0;i<n;i++){
    const v=(rnd()*2-1)*vary; g.fillStyle=`rgb(${base[0]+v|0},${base[1]+v|0},${base[2]+v|0})`;
    vertical ? g.fillRect(i*bw,0,bw,h) : g.fillRect(0,i*bw,w,bw);
    for(let k=0;k<grain;k++){
      g.strokeStyle=`rgba(0,0,0,${0.03+rnd()*0.07})`; g.lineWidth=0.6+rnd()*1.4; g.beginPath();
      if(vertical){ const x=i*bw+rnd()*bw; g.moveTo(x,0); g.bezierCurveTo(x+rnd()*8-4,h*.33,x+rnd()*8-4,h*.66,x+rnd()*6-3,h); }
      else { const y=i*bw+rnd()*bw; g.moveTo(0,y); g.bezierCurveTo(w*.33,y+rnd()*8-4,w*.66,y+rnd()*8-4,w,y+rnd()*6-3); }
      g.stroke();
    }
    g.fillStyle=gap;
    if(vertical) g.fillRect(i*bw,0,3,h); else { g.fillRect(0,i*bw,w,3); g.fillRect(rnd()*w,i*bw,2,bw); }
  }
}
const T = {
  woodDark: tex(512,512,(g,w,h)=>boards(g,w,h,{n:6,base:[74,60,50],vary:10,gap:'rgba(14,10,8,.95)',vertical:true,grain:30})),
  oak:      tex(512,512,(g,w,h)=>boards(g,w,h,{n:6,base:[200,168,128],vary:12,gap:'rgba(110,75,45,.45)',vertical:false,grain:25})),
  deck:     tex(512,512,(g,w,h)=>boards(g,w,h,{n:8,base:[132,98,70],vary:14,gap:'rgba(25,15,8,.9)',vertical:false,grain:18})),
  stone:    tex(512,512,(g,w,h)=>{ g.fillStyle='#57534c'; g.fillRect(0,0,w,h); let y=0;
              while(y<h){ const rh=26+rnd()*40; let x=-rnd()*60; while(x<w){ const rw=46+rnd()*90, v=(rnd()*55)|0;
                g.fillStyle=`rgb(${118+v},${113+v},${104+v})`; g.beginPath(); g.roundRect(x+3,y+3,rw-6,rh-6,9); g.fill(); x+=rw; } y+=rh; } }),
  roofA:    tex(256,256,(g,w,h)=>{ g.fillStyle='#36393c'; g.fillRect(0,0,w,h); for(let i=0;i<4;i++){ g.fillStyle='#26282a'; g.fillRect(i*64,0,5,h); g.fillStyle='#4a4e52'; g.fillRect(i*64+5,0,2,h);} }),
  roofB:    tex(256,256,(g,w,h)=>{ g.fillStyle='#36393c'; g.fillRect(0,0,w,h); for(let i=0;i<4;i++){ g.fillStyle='#26282a'; g.fillRect(0,i*64,w,5); g.fillStyle='#4a4e52'; g.fillRect(0,i*64+5,w,2);} }),
};
function std(color,o={}){ const m=new THREE.MeshStandardMaterial({color,roughness:o.r??0.85,metalness:o.m??0,map:o.map||null,side:o.side??THREE.FrontSide});
  if(o.s) m.userData.s=o.s; return m; }
const M = {
  plaster: std(0xefebe4,{r:.95}), ceiling: std(0xf6f3ee,{r:.95}),
  woodDark: std(0xffffff,{map:T.woodDark,r:.8,s:1.2}), woodDark2: std(0xffffff,{map:T.woodDark,r:.8,s:1.2,side:THREE.DoubleSide}),
  oak: std(0xffffff,{map:T.oak,r:.55,s:1.8}), deck: std(0xffffff,{map:T.deck,r:.8,s:1.6}),
  lining: std(0xffffff,{map:T.oak,r:.7,s:1.8,side:THREE.DoubleSide}),
  concrete: std(0xcdc8c0,{r:.6}), stone: std(0xffffff,{map:T.stone,r:.95,s:2.4}),
  roofA: std(0xffffff,{map:T.roofA,r:.5,m:.35,s:2}), roofB: std(0xffffff,{map:T.roofB,r:.5,m:.35,s:2}),
  slabEdge: std(0x3a3632,{r:.8}), frame: std(0x1d1d1f,{r:.5,m:.4}), black: std(0x151515,{r:.6}),
  glass: new THREE.MeshStandardMaterial({color:0xa9c3cc,roughness:0.04,metalness:0.1,transparent:true,opacity:0.2,depthWrite:false,side:THREE.DoubleSide}),
  ghost: new THREE.MeshStandardMaterial({color:0xffffff,transparent:true,opacity:0.22,depthWrite:false,side:THREE.DoubleSide}),
  ghostGlass: new THREE.MeshStandardMaterial({color:0xcfe0e6,transparent:true,opacity:0.1,depthWrite:false,side:THREE.DoubleSide}),
  fabric: std(0xdcd3c4), fabric2: std(0x6f6b64), woodMed: std(0x7a5a40,{r:.6}), white: std(0xf5f5f3,{r:.3}),
  bedding: std(0xf3f0ea), throwC: std(0x7f8f6e), counter: std(0x2f2f31,{r:.5}), top: std(0xe9e5de,{r:.35}),
  cabinet: std(0xe8e2d8,{r:.6}), rug: std(0xbcae98,{r:1}), bark: std(0x4b3a2c), leaf: std(0xffffff,{r:.9}),
  bush: std(0xffffff,{r:.9}), gravel: std(0x9c978e,{r:1}), car: std(0x2a2d31,{r:.35,m:.5}), boat: std(0xf2f2f0,{r:.3}),
};

// ---------- grupos (para poder ocultar) ----------
const groups = { site:new THREE.Group(), zc:new THREE.Group(), ff:new THREE.Group(), roof:new THREE.Group() };
Object.values(groups).forEach(g=>scene.add(g));
let G = groups.site;

// ---------- geometría base ----------
function planarUV(geo,s){ const p=geo.attributes.position,n=geo.attributes.normal,uv=geo.attributes.uv;
  for(let i=0;i<p.count;i++){ const ax=Math.abs(n.getX(i)),ay=Math.abs(n.getY(i)),az=Math.abs(n.getZ(i)); let u,v;
    if(ax>=ay&&ax>=az){u=p.getZ(i);v=p.getY(i);} else if(ay>=az){u=p.getX(i);v=p.getZ(i);} else {u=p.getX(i);v=p.getY(i);}
    uv.setXY(i,u/s,v/s); } uv.needsUpdate=true; }
function box(x0,x1,y0,y1,z0,z1,mat,o={}){
  const w=x1-x0,h=y1-y0,d=z1-z0; if(w<=0.001||h<=0.001||d<=0.001) return null;
  const g=new THREE.BoxGeometry(w,h,d); g.translate((x0+x1)/2,(y0+y1)/2,(z0+z1)/2);
  const s=(Array.isArray(mat)?mat[2]:mat).userData.s; if(s) planarUV(g,s);
  const m=new THREE.Mesh(g,mat); m.castShadow=o.cast!==false; m.receiveShadow=true; (o.group||G).add(m); return m;
}

// ---------- física simple para caminar ----------
const cols=[], floors=[], ramps=[];
function col(x1,z1,x2,z2,y0,y1,t){ cols.push({x1,z1,x2,z2,y0,y1,t}); }
function floorRect(x0,x1,z0,z1,y){ floors.push({x0,x1,z0,z1,y}); }
function ramp(x0,x1,z0,z1,axis,a0,a1,y0,y1){ ramps.push({x0,x1,z0,z1,axis,a0,a1,y0,y1}); }
function solid(x0,x1,z0,z1,y0,y1){ col(x0,z0,x1,z0,y0,y1,0.02); col(x0,z1,x1,z1,y0,y1,0.02); col(x0,z0,x0,z1,y0,y1,0.02); col(x1,z0,x1,z1,y0,y1,0.02); }

// ---------- muros, vidrios, barandas ----------
function pane(horiz,c,a0,a1,y0,y1,o={}){
  const mat=o.ghost?M.ghostGlass:M.glass;
  horiz ? box(a0,a1,y0,y1,c-0.015,c+0.015,mat,{cast:false}) : box(c-0.015,c+0.015,y0,y1,a0,a1,mat,{cast:false});
  if(o.ghost||o.noFrame) return;
  const fr=(p0,p1,q0,q1)=> horiz ? box(p0,p1,q0,q1,c-0.035,c+0.035,M.frame) : box(c-0.035,c+0.035,q0,q1,p0,p1,M.frame);
  fr(a0,a1,y0,y0+0.05); fr(a0,a1,y1-0.05,y1);
  const n=Math.max(1,Math.round((a1-a0)/1.4));
  for(let i=0;i<=n;i++){ const a=a0+(a1-a0)*i/n; fr(a-0.025,a+0.025,y0,y1); }
}
function wall(x1,z1,x2,z2,o={}){
  const base=o.base??LV_F, h=o.h??H, t=o.t??0.2, horiz=Math.abs(z1-z2)<1e-6;
  const a0=horiz?Math.min(x1,x2):Math.min(z1,z2), a1=horiz?Math.max(x1,x2):Math.max(z1,z2), c=horiz?z1:x1;
  const mat=o.ghost?M.ghost:(o.mat||M.plaster);
  const pieces=[]; let cur=a0;
  for(const [wa,wb,s,hd] of (o.win||[]).slice().sort((a,b)=>a[0]-b[0])){
    if(wa>cur) pieces.push([cur,wa,0,h]); pieces.push([wa,wb,0,s]); pieces.push([wa,wb,hd,h]);
    pane(horiz,c,wa,wb,base+s,base+hd); cur=wb;
  }
  if(cur<a1) pieces.push([cur,a1,0,h]);
  for(const [p0,p1,y0,y1] of pieces){
    if(y1-y0<0.01) continue;
    horiz ? box(p0,p1,base+y0,base+y1,c-t/2,c+t/2,mat,{cast:!o.ghost}) : box(c-t/2,c+t/2,base+y0,base+y1,p0,p1,mat,{cast:!o.ghost});
    if(o.out){ // revestimiento de madera oscura por el lado exterior
      const e0=p0===a0?0.12:0, e1=p1===a1?0.12:0, off=t/2+0.025, sg=(o.out==='n'||o.out==='w')?-1:1;
      horiz ? box(p0-e0,p1+e1,base+y0,base+y1,c+sg*off-0.025,c+sg*off+0.025,M.woodDark)
            : box(c+sg*off-0.025,c+sg*off+0.025,base+y0,base+y1,p0-e0,p1+e1,M.woodDark);
    }
  }
  if(!o.ghost&&!o.noCol){ const sh=t/2; horiz ? col(a0+sh,c,a1-sh,c,base,base+h,t/2) : col(c,a0+sh,c,a1-sh,base,base+h,t/2); }
}
function glass(x1,z1,x2,z2,o={}){
  const base=o.base??LV_F, horiz=Math.abs(z1-z2)<1e-6, c=horiz?z1:x1;
  const a0=horiz?Math.min(x1,x2):Math.min(z1,z2), a1=horiz?Math.max(x1,x2):Math.max(z1,z2);
  const y0=base+(o.y0??0), y1=base+(o.h??H);
  pane(horiz,c,a0,a1,y0,y1,o);
  if(!o.pass&&!o.ghost) col(x1,z1,x2,z2,y0,y1,0.05);
}
function rail(x1,z1,x2,z2,base){
  const horiz=Math.abs(z1-z2)<1e-6, c=horiz?z1:x1;
  const a0=horiz?Math.min(x1,x2):Math.min(z1,z2), a1=horiz?Math.max(x1,x2):Math.max(z1,z2);
  pane(horiz,c,a0,a1,base+0.05,base+1.0,{noFrame:true});
  horiz ? box(a0,a1,base+1.0,base+1.05,c-0.03,c+0.03,M.frame) : box(c-0.03,c+0.03,base+1.0,base+1.05,a0,a1,M.frame);
  col(x1,z1,x2,z2,base,base+1.05,0.04);
}
function slab(x0,x1,z0,z1,top,bottom=M.ceiling){
  box(x0,x1,LV_F-0.25,LV_F,z0,z1,[M.slabEdge,M.slabEdge,top,bottom,M.slabEdge,M.slabEdge]);
  floorRect(x0,x1,z0,z1,LV_F);
}
function post(x,z,y0,y1){ box(x-0.09,x+0.09,y0,y1,z-0.09,z+0.09,M.woodDark); }
function retaining(x0,x1,z0,z1,y1=3){ box(x0,x1,0,y1,z0,z1,M.stone); floorRect(x0,x1,z0,z1,y1); solid(x0,x1,z0,z1,0,y1); }

// ---------- muebles (bloques simples) ----------

  if(z>=12.25){ if(x>=-2.0-1e-6 && x<=4.0+1e-6 && z<=13.5+1e-6) return false; return true; } // hueco del patio inglés

}
function terrainH(x,z){

}

      if(axis==='x'){ g=new THREE.BoxGeometry(x1-x0,thick,L); g.rotateX(s*p); g.translate((x0+x1)/2,cy+dy,(z0+z1)/2+s*half/2); }
      else { g=new THREE.BoxGeometry(L,thick,z1-z0); g.rotateZ(-s*p); g.translate((x0+x1)/2+s*half/2,cy+dy,(z0+z1)/2); }

}

// ---------- fusionar geometría estática (menos llamadas de dibujo) ----------
function mergeGroup(grp){
  const buckets=new Map(), rm=[];
  for(const o of grp.children){
    if(!o.isMesh||o.isInstancedMesh||Array.isArray(o.material)||o.userData.noMerge||!o.geometry.index) continue;
    const k=o.material.uuid+'|'+o.castShadow; if(!buckets.has(k)) buckets.set(k,{mat:o.material,cast:o.castShadow,geos:[]});
    buckets.get(k).geos.push(o.geometry); rm.push(o);
  }
  rm.forEach(o=>grp.remove(o));
  for(const bk of buckets.values()){ const m=new THREE.Mesh(mergeGeometries(bk.geos,false),bk.mat); m.castShadow=bk.cast; m.receiveShadow=true; grp.add(m); }
}

function setHour(t){
  const f=(t-6)/14, el=Math.max(0.04,Math.sin(Math.PI*f))*(58*Math.PI/180), az=Math.PI*f;
  const dir=new THREE.Vector3(Math.cos(az)*Math.cos(el),Math.sin(el),-Math.sin(az)*Math.cos(el));
  sun.position.copy(CENTER).addScaledVector(dir,110); sun.target.position.copy(CENTER); sun.target.updateMatrixWorld();
  const warm=1-Math.min(1,Math.sin(el)/Math.sin(35*Math.PI/180));
  sun.color.setRGB(1,0.95-0.28*warm,0.88-0.5*warm); sun.intensity=3.2*Math.min(1,0.35+Math.sin(el)*1.4);
  hemi.intensity=0.7+0.5*Math.sin(el);
  skyU.horizon.value.copy(srgb(236,226,212)).lerp(srgb(245,205,165),warm); skyU.top.value.copy(srgb(105,158,215)).lerp(srgb(120,150,200),warm*0.6);
  scene.fog.color.copy(skyU.horizon.value);
  const hh=Math.floor(t), mm=Math.round((t-hh)*60); document.getElementById('hourTxt').textContent=`${hh}:${String(mm).padStart(2,'0')}`;
}

  const fl=getFloor(player.x,player.z,player.feet).y;
  if(fl>=player.feet){ player.feet=fl; player.vy=0; player.grounded=true; }
  else if(player.grounded&&player.feet-fl<0.4){ player.feet=fl; }
  else { player.grounded=false; player.vy-=9.8*dt; player.feet+=player.vy*dt; if(player.feet<=fl){ player.feet=fl; player.vy=0; player.grounded=true; } }
  player.eye+=(player.feet+1.62-player.eye)*Math.min(1,dt*12);
  camera.position.set(player.x,player.eye,player.z); camera.rotation.set(player.pitch,player.yaw,0);
}

// ---------- input ----------
const tRoof=document.getElementById('tRoof'), tFF=document.getElementById('tFF'), tLabels=document.getElementById('tLabels');
[tRoof,tFF,tLabels].forEach(el=>el.addEventListener('change',setVis));
const help=document.getElementById('help');
const touch=matchMedia('(pointer:coarse)').matches;
function setMode(){
  document.getElementById('mOrbit').classList.toggle('on',mode==='orbit'); document.getElementById('mWalk').classList.toggle('on',mode==='walk');
  help.textContent = mode==='orbit'
    ? (touch ? 'Un dedo gira · dos dedos acercan y mueven · elige un lugar en “Ir a…” para caminar'
             : 'Arrastra para girar · rueda para acercar · clic derecho para mover · doble clic en un piso para entrar caminando')
    : (touch ? 'Arrastra para mirar · flechas para caminar · toca el piso para ir ahí'
             : 'Arrastra para mirar · W/↑ avanzar · S/↓ retroceder · ←/→ girar · A/D de lado · Shift corre · clic en el piso para ir ahí · Esc sale');
}
addEventListener('keydown',e=>{ if(['INPUT','SELECT'].includes(e.target.tagName)) return; keys[e.code]=true;
  if(e.code==='Escape'&&mode==='walk') exitWalk(); if(mode==='walk'&&e.code.startsWith('Arrow')) e.preventDefault(); });
addEventListener('keyup',e=>{ keys[e.code]=false; });
addEventListener('blur',()=>{ for(const k in keys) keys[k]=false; });
document.querySelectorAll('#dpad button').forEach(bt=>{ const k=bt.dataset.k;
  bt.addEventListener('pointerdown',e=>{ e.preventDefault(); dp[k]=true; walkTarget=null; });
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>bt.addEventListener(ev,()=>{ dp[k]=false; })); });

const ray=new THREE.Raycaster(); ray.camera=camera;
const visibleChain=o=>{ for(let p=o;p;p=p.parent) if(!p.visible) return false; return true; };
function pick(cx,cy){
  const r=renderer.domElement.getBoundingClientRect();
  ray.setFromCamera(new THREE.Vector2(((cx-r.left)/r.width)*2-1,-((cy-r.top)/r.height)*2+1),camera);
  for(const h of ray.intersectObjects([groups.site,groups.zc,groups.ff,groups.roof],true)){
    if(h.object.isSprite) continue; const m=h.object.material; if(m===M.glass||m===M.ghost||m===M.ghostGlass) continue;
    if(!visibleChain(h.object)) continue;
    const n=h.face?h.face.normal.clone().transformDirection(h.object.matrixWorld):new THREE.Vector3(0,1,0);
    return {point:h.point,up:n.y>0.6};
  }
  return null;
}
let drag=null;
renderer.domElement.addEventListener('pointerdown',e=>{ if(mode!=='walk') return; drag={x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,t:performance.now()}; renderer.domElement.setPointerCapture(e.pointerId); });
renderer.domElement.addEventListener('pointermove',e=>{ if(mode!=='walk'||!drag) return;
  const k=touch?0.006:0.0042; player.yaw+=(e.clientX-drag.x)*k; player.pitch=Math.max(-1.3,Math.min(1.3,player.pitch+(e.clientY-drag.y)*k));
  drag.x=e.clientX; drag.y=e.clientY; });
renderer.domElement.addEventListener('pointerup',e=>{ if(mode!=='walk'||!drag) return;
  const moved=Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy), quick=performance.now()-drag.t<450; drag=null;
  if(moved<6&&quick){ const h=pick(e.clientX,e.clientY); if(h&&h.up&&Math.hypot(h.point.x-player.x,h.point.z-player.z)<40) { walkTarget={x:h.point.x,z:h.point.z}; stuck=0; } } });
renderer.domElement.addEventListener('dblclick',e=>{ if(mode!=='orbit') return; const h=pick(e.clientX,e.clientY); if(!h||!h.up) return;
  const d=new THREE.Vector3(); camera.getWorldDirection(d); enterWalk(h.point.x,h.point.z,h.point.y,Math.atan2(-d.x,-d.z)); });

// ---------- lugares ----------
const PLACES=[
  ['Primer piso',[
    ['Living · vista al lago',6.4,LV_F,7.2,0.45],['Cocina',2.8,LV_F,10.7,0.2],['Quincho',-3.3,LV_F,10.9,0.25],['Terraza',3.7,LV_F,-0.9,0.35],
    ['Dormitorio 1 (principal)',15.6,LV_F,7.0,-0.8],['Dormitorio 2',8.1,LV_F,6.6,-0.7],['Entrada',6.5,LV_F,12.9,0]]],
  ['Zócalo (piso de abajo)',[
    ['Sala de estar',6.8,LV_Z,7.4,0.7],['Terraza cubierta',3.7,LV_Z,3.0,0],['Dormitorio 3',12.3,LV_Z,7.3,0.75],
    ['Dormitorio 4',-0.5,LV_Z,7.3,0.75],['Dormitorio 5',-4.2,LV_Z,7.3,0.75],['Patio inglés',3.2,LV_Z,13.2,0.9]]],
  ['Exterior',[
    ['Jardín frente a la casa',9,0,-11,Math.PI-0.25],['Estacionamiento',-15,LV_F,9.5,-1.2],['Muelle',-5.5,-8.75,-40,Math.PI+0.3]]],
];
const sel=document.getElementById('goto');
sel.innerHTML='<option value="">Elige un lugar…</option>'+PLACES.map(([g,items],gi)=>`<optgroup label="${g}">${items.map((it,ii)=>`<option value="${gi}.${ii}">${it[0]}</option>`).join('')}</optgroup>`).join('');
sel.addEventListener('change',()=>{ if(!sel.value) return; const [gi,ii]=sel.value.split('.').map(Number); const [,x,y,z,yaw]=PLACES[gi][1][ii];
  enterWalk(x,z,y,yaw); sel.value=''; sel.blur(); });

document.getElementById('mWalk').onclick=()=>{ if(mode!=='walk') enterWalk(6.4,7.2,LV_F,0.45); };
document.getElementById('mOrbit').onclick=()=>{ if(mode==='walk') exitWalk(); };
document.getElementById('vGeneral').onclick=()=>{ if(mode==='walk') exitWalk(); tRoof.checked=true; tFF.checked=true; setVis(); flyTo([-26,17,-29],[7,2.5,5]); };
document.getElementById('vPlanta').onclick=()=>{ if(mode==='walk') exitWalk(); tRoof.checked=false; setVis(); flyTo([6.3,48,5.95],[6.3,0,5.9]); };
document.getElementById('collapse').onclick=e=>{ const p=document.getElementById('panel'); p.classList.toggle('min'); e.target.textContent=p.classList.contains('min')?'+':'–'; };
const hour=document.getElementById('hour'); hour.addEventListener('input',()=>setHour(+hour.value));
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });

// ---------- loop ----------
setHour(+hour.value); setVis(); setMode();
const clock=new THREE.Clock(); let first=true;
renderer.setAnimationLoop(()=>{
  const dt=Math.min(0.05,clock.getDelta());
  if(mode==='walk'){ updateWalk(dt);
    if(tLabels.checked) for(const l of labels){ const d=l.position.distanceTo(camera.position); l.visible=d<9&&Math.abs(l.position.y-camera.position.y)<2.2; } }
  else { if(anim){ anim.t+=dt; const k=Math.min(1,anim.t/anim.dur), e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
      camera.position.lerpVectors(anim.p0,anim.p1,e); controls.target.lerpVectors(anim.t0,anim.t1,e); if(k>=1) anim=null; }
    controls.update(); }
  sky.position.copy(camera.position);
  renderer.render(scene,camera);
  if(first){ first=false; document.getElementById('loading').remove(); }
});
window.__casa={player,getFloor,enterWalk,exitWalk,groups,camera,controls,renderer,scene,sun,keys,updateWalk};
</script>
